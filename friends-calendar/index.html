<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>친구 일정 조율 캘린더</title>
  <link rel="stylesheet" href="style.css?v=20260803-6" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <input id="boardTitle" class="board-title" maxlength="28" value="친구 약속 잡기" aria-label="모임 이름" />
      </div>
      <div class="top-actions">
        <span id="connectionStatus" class="connection connected">연결됨</span>
        <button id="shareButton" class="icon-text-button" type="button" aria-label="공유 링크 복사">공유</button>
        <button id="settingsButton" class="icon-button" type="button" aria-label="설정 열기">⚙</button>
      </div>
    </header>

    <section id="statusBanner" class="status-banner" hidden>
      Firebase에 연결하는 중입니다.
    </section>

    <main class="calendar-shell" aria-label="친구 일정 조율표">
      <section id="topDateDrag" class="drag-guide" aria-label="날짜 조정 바">
        <div class="drag-guide-copy">
          <strong><span aria-hidden="true">↔</span> 드래그하여 날짜 조정 <span aria-hidden="true">↔</span></strong>
        </div>
      </section>
      <div class="calendar-stage">
        <div id="calendarScroller" class="calendar-scroller">
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
        <div id="monthTracker" class="month-tracker" aria-live="polite">
          <span id="monthTrackerCurrent" class="month-tracker-label"></span>
          <span id="monthTrackerNext" class="month-tracker-label month-tracker-next" aria-hidden="true"></span>
        </div>
      </div>
      <section id="bottomDateDrag" class="drag-guide drag-guide-bottom" aria-label="날짜 조정 바">
        <div class="drag-guide-copy">
          <strong><span aria-hidden="true">↔</span> 드래그하여 날짜 조정 <span aria-hidden="true">↔</span></strong>
        </div>
      </section>
    </main>

    <button id="todayButton" class="today-button" type="button" hidden>오늘로</button>
  </div>

  <dialog id="confirmDialog" class="modal">
    <form method="dialog" class="modal-panel">
      <div class="modal-kicker">약속 확정</div>
      <h2 id="confirmTitle">약속을 확정할까요?</h2>
      <p id="confirmSummary"></p>
      <div id="maybeList" class="maybe-list"></div>
      <div class="modal-actions">
        <button class="secondary-button" value="cancel">취소</button>
        <button id="confirmAction" class="primary-button" value="confirm">약속 확정</button>
      </div>
    </form>
  </dialog>

  <dialog id="cancelDialog" class="modal">
    <form method="dialog" class="modal-panel">
      <div class="modal-kicker">확정 취소</div>
      <h2 id="cancelTitle">확정을 취소할까요?</h2>
      <p>취소하면 현재 참석 현황을 기준으로 다시 판정됩니다.</p>
      <div class="modal-actions">
        <button class="secondary-button" value="cancel">돌아가기</button>
        <button id="cancelAction" class="danger-button" value="confirm">확정 취소</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="modal">
    <form method="dialog" class="modal-panel">
      <div class="modal-kicker">설정</div>
      <h2>참여자 관리</h2>
      <p>참여 인원은 2명부터 12명까지 조절할 수 있습니다. 이름이 비어 있는 행은 집계에서 제외됩니다.</p>
      <label class="participant-count-control">
        <span>참여 인원</span>
        <input id="participantCountInput" type="range" min="2" max="12" step="1" />
        <strong id="participantCountLabel">6명</strong>
      </label>
      <label class="threshold-control">
        <span>유력 기준</span>
        <input id="thresholdInput" type="range" min="50" max="100" step="5" />
        <strong id="thresholdLabel">80%</strong>
      </label>
      <div class="modal-actions">
        <button class="primary-button" value="confirm">닫기</button>
      </div>
    </form>
  </dialog>

  <dialog id="onboardingDialog" class="modal onboarding-dialog">
    <section class="modal-panel onboarding-panel" aria-labelledby="onboardingTitle">
      <div class="onboarding-progress"><span id="onboardingStep">1 / 2</span></div>
      <div class="modal-kicker">처음 오셨군요</div>
      <h2 id="onboardingTitle">날짜 칸을 눌러보세요</h2>
      <p id="onboardingDescription">클릭할 때마다 빈칸, ○, ×, △ 순서로 상태가 바뀝니다.</p>

      <div id="tapTutorial" class="tutorial-demo tutorial-tap" aria-hidden="true">
        <span class="tutorial-demo-hint">한 번 누르기</span>
        <div class="tutorial-cell tutorial-tap-cell"><span>○</span></div>
        <span class="tutorial-finger tutorial-tap-finger">☝</span>
      </div>

      <div id="dragTutorial" class="tutorial-demo tutorial-drag" aria-hidden="true" hidden>
        <span class="tutorial-demo-hint">누른 채로 옆으로 이동</span>
        <div class="tutorial-drag-cells">
          <span>○</span><span>○</span><span>○</span><span>○</span><span>○</span>
        </div>
        <span class="tutorial-finger tutorial-drag-finger">☝</span>
      </div>

      <div class="modal-actions">
        <button id="onboardingAction" class="primary-button" type="button">다음</button>
      </div>
    </section>
  </dialog>

  <div id="stampLayer" class="stamp-layer" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js?v=20260803-6"></script>
</body>
</html>
